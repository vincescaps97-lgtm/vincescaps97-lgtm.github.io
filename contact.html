<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contatti — Vincenzo Capasso</title>
<meta name="description" content="Connettiamoci ed esploriamo opportunità di collaborazione.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem("theme");if(!t){t="dark";}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="dark";}})();</script>
<link rel="stylesheet" href="css/style.css?v=32">
<link rel="stylesheet" href="css/content.css?v=32">
</head>
<body>

<main class="contact">

  <p class="scribble scribble--l">Connettiamoci</p>
  <p class="scribble scribble--r">Disponibile per nuove collaborazioni</p>

  <!-- Niente form: su un sito statico non invierebbe nulla. Il
       contatto è la mail, quindi il bottone è la mail. -->
  <div class="mailcta">
    <h1 class="mailcta__title">Scrivimi</h1>

    <a class="mailcta__btn" id="mailBtn" href="#">
      <img class="mailcta__icon" id="mailIcon" alt="" aria-hidden="true" width="160" height="160">
    </a>

    <p class="mailcta__sub">Raccontami di cosa ti occupi e cosa vuoi costruire.</p>
  </div>
</main>

<section class="sec" style="padding-top:0">
  <div class="sec__head"><h2 class="sec__title">Trovami anche qui</h2></div>
  <ul class="posts" id="contacts"></ul>
</section>

<footer class="foot">
  <p>&copy; <span data-year></span> Vincenzo Capasso. Tutti i diritti riservati.</p>
  <p id="footlinks"></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script type="module">
  import { boot } from "./js/site.js";
  import { NAV } from "./js/nav.js";
  import { PROFILE, SOCIALS } from "./js/data.js";
  import { socialLinks } from "./js/render.js";

  boot({ page: "contact" });

  // Il bottone è un mailto: l'icona è quella della dock, così
  // il contatto usa lo stesso segnale che si vede già nell'hero.
  // L'indirizzo non compare da nessuna parte come testo: esiste
  // solo dentro l'href, quindi non è leggibile con un copia e
  // incolla e non finisce in un indice.
  const mailto = "mailto:" + PROFILE.email;
  document.getElementById("mailBtn").href = mailto;
  // l'icona sta in NAV: la stessa sorgente, nessun duplicato
  document.getElementById("mailIcon").src = NAV.find((n) => n.id === "contact").icon;

  const rows = [
    { k: "Posizione", v: PROFILE.location },
    ...SOCIALS.map((s) => ({ k: s.label, v: s.href, href: s.href })),
  ];

  document.getElementById("contacts").innerHTML = rows.map((r) => `
    <li class="post">
      <div>
        <time>${r.k}</time>
        <h3>${r.href ? `<a href="${r.href}" target="_blank" rel="noopener">${r.v.replace(/^https?:\/\//, "")}</a>` : r.v}</h3>
      </div>
    </li>`).join("");

  document.getElementById("footlinks").innerHTML = socialLinks(SOCIALS);
</script>
</body>
</html>
