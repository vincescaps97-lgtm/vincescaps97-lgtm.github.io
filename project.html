<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — Vincenzo Capasso</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem("theme");if(!t){t="dark";}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="dark";}})();</script>
<link rel="stylesheet" href="css/style.css?v=30">
<link rel="stylesheet" href="css/content.css?v=30">
</head>
<body>

<main class="page" id="app"></main>

<footer class="foot">
  <p>&copy; <span data-year></span> Vincenzo Capasso. Tutti i diritti riservati.</p>
  <p id="footlinks"></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script type="module">
  import { boot } from "./js/site.js";
  import { PROJECTS, byslug, SOCIALS } from "./js/data.js";
  import { projectBg, projectBody, titleLen, socialLinks } from "./js/render.js";

  boot({ page: "projects" });

  const slug = new URLSearchParams(location.search).get("slug");
  const p = byslug(PROJECTS, slug);
  const app = document.getElementById("app");

  if (!p) {
    document.title = "Non trovato — Vincenzo Capasso";
    app.innerHTML = `
      <header class="pagehead">
        <h1 class="pagehead__title">Non trovato</h1>
        <p class="pagehead__lede">Questo progetto non esiste.</p>
      </header>
      <section class="sec sec--tight"><a class="backlink" href="projects.html">&larr; Tutti i progetti</a></section>`;
  } else {
    document.title = p.title + " — Vincenzo Capasso";
    const next = PROJECTS[(PROJECTS.indexOf(p) + 1) % PROJECTS.length];

    app.innerHTML = `
      <header class="pagehead">
        <a class="backlink" href="projects.html">&larr; Tutti i progetti</a>
        <h1 class="pagehead__title" data-len="${titleLen(p.title)}">${p.title}</h1>
      </header>

      <section class="sec sec--tight">
        <div class="heroimg" style="background-image:${projectBg(p)}"></div>
        <div class="article">
          <div class="article__meta">
            <span><b>Cliente</b> ${p.client}</span>
            <span><b>Anno</b> ${p.year}</span>
            <span><b>Ruolo</b> ${p.role}</span>
          </div>
          <div class="pcard__cats" style="margin:1.25rem 0">
            ${p.cats.map((c) => `<span class="tag">${c}</span>`).join("")}
          </div>
          <p class="lede">${p.excerpt}</p>
          ${projectBody(p.body)}
        </div>
      </section>

      <section class="sec" style="border-top:1px solid var(--line)">
        <div class="sec__head"><h2 class="sec__title">Prossimo progetto</h2></div>
        <a class="pcard reveal" href="project.html?slug=${next.slug}" style="max-width:420px">
          <div class="pcard__media" data-year="${next.year}"
               style="background-image:${projectBg(next)}"></div>
          <div class="pcard__body">
            <h3 class="pcard__title" data-len="${titleLen(next.title)}">${next.title}</h3>
            <span class="pcard__cta">Apri progetto</span>
          </div>
        </a>
      </section>`;
  }

  document.getElementById("footlinks").innerHTML = socialLinks(SOCIALS);
</script>
</body>
</html>
