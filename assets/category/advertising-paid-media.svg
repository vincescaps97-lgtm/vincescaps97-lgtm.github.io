<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Advertising &amp; Paid Media: un annuncio con il cursore che clicca">
  <!--
    CATEGORIA 1 — Advertising & Paid Media

    Un annuncio (il riquadro verde) e il puntatore che lo clicca:
    l'oggetto del lavoro è il click, quindi è quello che si disegna.

    Palette: nero, bianco e verde acqua. Il nero e il bianco compaiono
    SOLO dentro il riquadro verde — fuori diventerebbero invisibili
    (il nero sul tema scuro del sito, il bianco sulla card bianca).
    Il verde invece si vede su entrambi i fondi.

    Stesso linguaggio degli altri tre: spessore 24, angoli tondi,
    forme semplici. Nessun gradiente.
  -->

  <!-- il riquadro dell'annuncio: unica massa piena -->
  <rect x="230" y="270" width="740" height="400" rx="44" fill="#3CCAB1"/>

  <!-- il visual a sinistra: bianco, con dentro due velature di verde
       chiaro che fanno da foto -->
  <rect x="290" y="330" width="250" height="200" rx="20" fill="#FFFFFF"/>
  <circle cx="345" cy="382" r="34" fill="#5FD8C4"/>
  <rect x="400" y="354" width="112" height="22" rx="11" fill="#A8E9DC"/>
  <rect x="400" y="394" width="76" height="22" rx="11" fill="#A8E9DC"/>
  <rect x="310" y="468" width="210" height="42" rx="12" fill="#A8E9DC"/>

  <!-- le righe di copy: fori neri nel verde, non testo -->
  <rect x="590" y="340" width="310" height="30" rx="15" fill="#000000" opacity=".82"/>
  <rect x="590" y="392" width="210" height="30" rx="15" fill="#000000" opacity=".45"/>

  <!-- il bottone: verde scuro, l'unico tono più profondo nel file -->
  <rect x="590" y="460" width="170" height="58" rx="29" fill="#1C7A6D"/>

  <!-- il cursore. Sta dentro il riquadro, quindi il nero del bordo
       si vede: il puntatore bianco appoggiato sul verde è l'unico
       punto in cui i due colori si toccano -->
  <path d="M800 424v150l44-36 28 62 36-16-28-54 56-4z"
        fill="#FFFFFF" stroke="#000000" stroke-width="10"
        stroke-linejoin="round"/>
</svg>