<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Le ricerche di brand di una concessionaria crescono da 700 a 1600 al mese: curva in salita sopra un'auto">
  <!--
    COPERTINA 2 — performance branding, concessionaria locale

    Il progetto in un'immagine: la curva in salita (le ricerche di
    brand che crescono) sopra l'auto, con la lente di ricerca.

    Palette: nero, bianco e verde acqua, con i verdi della famiglia
    del verde pieno per i piani. Il fondo è nero puro: tiene dentro
    la palette e dà il contrasto massimo al verde, che è il colore
    del sito. Qui il verde pieno fa la massa dell'auto, il chiaro
    i dettagli, il profondo le linee della griglia.

    Il soggetto sta dentro x 120–1080 e y 130–770: è la parte che
    resta anche quando la pagina di dettaglio ritaglia in 16:9. La
    lente sta sopra la velatura che l'anno disegna a hover, quindi
    non ci si sovrappone mai. Niente testo dentro.
  -->
  <rect width="1200" height="900" fill="#000000"/>

  <!-- linee di griglia, discrete: danno la sensazione di "dati" -->
  <g stroke="#1C7A6D" stroke-opacity=".35" stroke-width="3" fill="none">
    <path d="M200 262h860M200 352h860M200 442h860M200 532h860"/>
  </g>

  <!-- il segnale di crescita, in alto a sinistra: una freccia in su
       disegnata orizzontale e ruotata, così la punta resta
       dritta invece di diventare un lampo -->
  <g stroke="#3CCAB1" stroke-width="9" fill="none" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M244 330h56M282 316l18 14-18 14" transform="rotate(-42 272 330)"/>
  </g>

  <!-- la lente di ricerca, a sinistra -->
  <g stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round" opacity=".9">
    <circle cx="250" cy="470" r="52"/>
    <path d="M286 506l60 60"/>
  </g>

  <!-- la curva in salita, con il punto di arrivo aperto -->
  <path d="M200 620C360 612 460 576 560 512S780 372 1020 236L1020 660H200Z"
        fill="#3CCAB1" opacity=".12"/>
  <path d="M200 620C360 612 460 576 560 512S780 372 1020 236"
        fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <!-- il punto di partenza, vuoto: da 700 ricerche -->
  <circle cx="200" cy="620" r="13" fill="#000000" stroke="#FFFFFF" stroke-width="7"/>
  <!-- il punto di arrivo, con l'anello in verde chiaro -->
  <circle cx="1020" cy="236" r="19" fill="#000000" stroke="#5FD8C4" stroke-width="9"/>

  <!-- l'auto, in basso al centro -->
  <g>
    <!-- corpo -->
    <path d="M470 700 L486 636 Q492 610 524 604 L610 584 Q634 580 650 598
             L706 638 L764 656 Q784 664 786 690 L786 700 Z"
          fill="#3CCAB1"/>
    <!-- finestre: fori scuri nel verde, non finestre vere -->
    <path d="M528 646 L602 626 Q616 622 628 634 L650 656 L528 656 Z"
          fill="#000000" opacity=".55"/>
    <path d="M662 638 L700 658 L652 658 L642 638 Z" fill="#000000" opacity=".4"/>
    <!-- ruote -->
    <circle cx="560" cy="700" r="44" fill="#1C7A6D"/>
    <circle cx="560" cy="700" r="18" fill="#000000"/>
    <circle cx="712" cy="700" r="44" fill="#1C7A6D"/>
    <circle cx="712" cy="700" r="18" fill="#000000"/>
    <!-- luce -->
    <circle cx="770" cy="682" r="12" fill="#A8E9DC"/>
  </g>
</svg>