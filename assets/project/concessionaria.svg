<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Le ricerche di brand di una concessionaria crescono da 700 a 1600 al mese: curva in salita sopra un'auto">
  <!--
    COPERTINA 2 — performance branding, concessionaria locale
    Il progetto in un'immagine: la curva in salita (le ricerche di
    brand che crescono) sopra l'auto, con la lente di ricerca.
    Forme semplici, due colori, niente testo. Palette: ciano.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- linee di griglia, discrete: danno la sensazione di "dati" -->
  <g stroke="#ffffff" stroke-opacity=".1" stroke-width="2" fill="none">
    <path d="M150 258h900M150 350h900M150 442h900M150 534h900"/>
  </g>

  <!-- la curva in salita, con il punto finale aperto -->
  <path d="M150 542 C 320 534, 430 500, 540 440 S 760 320, 900 226 L 900 300 L 150 566 Z"
        fill="#eafdff" opacity=".12"/>
  <path d="M150 542 C 320 534, 430 500, 540 440 S 760 320, 900 226"
        fill="none" stroke="#eafdff" stroke-width="9" stroke-linecap="round"/>
  <circle cx="900" cy="226" r="19" fill="#0e7490" stroke="#eafdff" stroke-width="9"/>

  <!-- la lente di ricerca, in basso a sinistra -->
  <g stroke="#eafdff" stroke-width="9" fill="none" opacity=".9">
    <circle cx="216" cy="706" r="56"/>
    <path d="M256 746 l62 62" stroke-linecap="round"/>
  </g>

  <!-- l'auto, in basso al centro -->
  <g opacity=".95">
    <!-- corpo -->
    <path d="M396 762 L418 668 Q426 636 462 628 L556 602 Q584 596 604 618 L664 664 L730 686 Q754 696 758 726 L758 762 Z"
          fill="#eafdff"/>
    <!-- finestre, in tinte diverse per non appesantire -->
    <path d="M452 660 L540 634 Q556 630 570 644 L598 672 L452 672 Z" fill="#0e7490" opacity=".55"/>
    <path d="M612 660 L660 686 L604 686 L592 660 Z" fill="#0e7490" opacity=".4"/>
    <!-- ruote -->
    <circle cx="490" cy="764" r="46" fill="#0b3d47"/>
    <circle cx="490" cy="764" r="19" fill="#a5f3fc"/>
    <circle cx="672" cy="764" r="46" fill="#0b3d47"/>
    <circle cx="672" cy="764" r="19" fill="#a5f3fc"/>
    <!-- luce -->
    <circle cx="746" cy="712" r="12" fill="#0b3d47" opacity=".5"/>
  </g>

  <!-- il segnale di crescita, in alto a sinistra -->
  <g stroke="#eafdff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M188 214 l34 -40 l-22 -1 l28 -40"/>
  </g>

  <!-- il punto di partenza, aperto: da 700 ricerche -->
  <circle cx="150" cy="542" r="13" fill="#0e7490" stroke="#eafdff" stroke-width="7"/>
</svg>
