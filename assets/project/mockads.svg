<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="MockAds: la stessa creatività mostrata nei formati storia, post e portrait">
  <!--
    COPERTINA 3 — MockAds, il tool per fare i mockup
    L'idea del progetto in un'immagine: una sola creatività che
    diventa tre formati diversi, con le frecce che collegano.
    Forme semplici, due colori, niente testo. Palette: verde.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- la creatività, una sola: il quadrato al centro -->
  <g>
    <rect x="472" y="300" width="256" height="256" rx="22" fill="#f0fff9" opacity=".96"/>
    <circle cx="530" cy="360" r="30" fill="#047857" opacity=".2"/>
    <rect x="574" y="340" width="112" height="14" rx="7" fill="#047857" opacity=".75"/>
    <rect x="574" y="366" width="78" height="14" rx="7" fill="#047857" opacity=".45"/>
    <rect x="504" y="444" width="128" height="14" rx="7" fill="#047857" opacity=".55"/>
    <rect x="504" y="470" width="96" height="14" rx="7" fill="#047857" opacity=".3"/>
    <rect x="504" y="504" width="104" height="30" rx="15" fill="#047857"/>
  </g>

  <!-- formato storia, a sinistra -->
  <g>
    <rect x="150" y="252" width="152" height="272" rx="18" fill="#047857" opacity=".55"/>
    <circle cx="190" cy="302" r="20" fill="#d3f9ec" opacity=".8"/>
    <rect x="220" y="292" width="60" height="10" rx="5" fill="#d3f9ec" opacity=".8"/>
    <rect x="220" y="310" width="40" height="10" rx="5" fill="#d3f9ec" opacity=".5"/>
    <rect x="176" y="428" width="100" height="12" rx="6" fill="#d3f9ec" opacity=".75"/>
    <rect x="176" y="450" width="72" height="12" rx="6" fill="#d3f9ec" opacity=".45"/>
    <rect x="176" y="480" width="80" height="24" rx="12" fill="#0b3d2e" opacity=".6"/>
  </g>

  <!-- formato portrait, a destra -->
  <g>
    <rect x="898" y="286" width="164" height="204" rx="18" fill="#047857" opacity=".55"/>
    <circle cx="940" cy="332" r="21" fill="#d3f9ec" opacity=".8"/>
    <rect x="972" y="322" width="66" height="10" rx="5" fill="#d3f9ec" opacity=".8"/>
    <rect x="972" y="340" width="44" height="10" rx="5" fill="#d3f9ec" opacity=".5"/>
    <rect x="926" y="424" width="108" height="12" rx="6" fill="#d3f9ec" opacity=".75"/>
    <rect x="926" y="446" width="76" height="12" rx="6" fill="#d3f9ec" opacity=".45"/>
    <rect x="926" y="474" width="86" height="24" rx="12" fill="#0b3d2e" opacity=".6"/>
  </g>

  <!-- le frecce: da una creatività ai tre formati -->
  <g stroke="#eafff5" stroke-width="6" fill="none" stroke-linecap="round" opacity=".8">
    <path d="M302 400 h150" />
    <path d="M728 400 h150" />
  </g>
  <g fill="#eafff5" opacity=".8">
    <path d="M452 400 l-20 -11 v22 z"/>
    <path d="M878 400 l-20 -11 v22 z"/>
  </g>

  <!-- il punto di partenza, aperto -->
  <circle cx="302" cy="400" r="12" fill="#0b3d2e" stroke="#eafff5" stroke-width="6"/>
  <circle cx="878" cy="400" r="12" fill="#0b3d2e" stroke="#eafff5" stroke-width="6"/>
</svg>
