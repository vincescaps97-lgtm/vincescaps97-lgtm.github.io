<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Il metodo di test modulare: la griglia di sei varianti con una cella cambiata, il macchinario del centro estetico e il costo per lead in discesa">
  <!--
    COPERTINA 1 — caso studio centri estetici
    Il metodo del progetto in un'immagine: la matrice 3×2 delle
    varianti con una sola cella cambiata (cambiare solo ciò che non
    funziona), il macchinario, e la curva del CPL che scende.
    Forme semplici, due colori, niente testo: è una copertina, non
    uno screenshot. Palette: verde acqua.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- macchinario, a sinistra -->
  <g opacity=".92">
    <rect x="118" y="404" width="26" height="188" rx="13" fill="#ccfbf1"/>
    <rect x="86" y="578" width="90" height="26" rx="13" fill="#ccfbf1"/>
    <rect x="120" y="248" width="30" height="162" rx="15" fill="#ccfbf1"/>
    <path d="M135 250 L232 196" stroke="#ccfbf1" stroke-width="30" stroke-linecap="round"/>
    <rect x="212" y="168" width="96" height="42" rx="21" fill="#5eead4" transform="rotate(-27 260 189)"/>
  </g>

  <!-- la matrice 3×2: una cella accesa e una con bordo tratteggiato -->
  <g>
    <!-- riga 1 -->
    <rect x="392" y="182" width="200" height="118" rx="14" fill="#0b4f47" opacity=".72"/>
    <rect x="420" y="216" width="96" height="11" rx="5.5" fill="#7fded0" opacity=".85"/>
    <rect x="420" y="240" width="140" height="9" rx="4.5" fill="#7fded0" opacity=".5"/>

    <rect x="628" y="182" width="200" height="118" rx="14" fill="#0b4f47" opacity=".72"/>
    <rect x="656" y="216" width="96" height="11" rx="5.5" fill="#7fded0" opacity=".85"/>
    <rect x="656" y="240" width="140" height="9" rx="4.5" fill="#7fded0" opacity=".5"/>

    <!-- la cella vincente: riempita di chiaro, con la freccia -->
    <rect x="864" y="182" width="200" height="118" rx="14" fill="#eafff9"/>
    <rect x="892" y="216" width="96" height="11" rx="5.5" fill="#0d9488"/>
    <rect x="892" y="240" width="140" height="9" rx="4.5" fill="#0d9488" opacity=".45"/>
    <path d="M1024 214 h40 a8 8 0 0 1 8 8 v22 a8 8 0 0 1-8 8 h-40 z" fill="#0d9488" opacity=".14"/>
    <path d="M1028 240 l14 -13 0 9 12 0 -14 13 0 -9 z" fill="#0d9488"/>

    <!-- riga 2 -->
    <rect x="392" y="334" width="200" height="118" rx="14" fill="#0b4f47" opacity=".72"/>
    <rect x="420" y="368" width="96" height="11" rx="5.5" fill="#7fded0" opacity=".85"/>
    <rect x="420" y="392" width="140" height="9" rx="4.5" fill="#7fded0" opacity=".5"/>

    <rect x="628" y="334" width="200" height="118" rx="14" fill="#0b4f47" opacity=".72"/>
    <rect x="656" y="368" width="96" height="11" rx="5.5" fill="#7fded0" opacity=".85"/>
    <rect x="656" y="392" width="140" height="9" rx="4.5" fill="#7fded0" opacity=".5"/>

    <!-- la cella da cambiare: bordo tratteggiato, ancora scura -->
    <rect x="864" y="334" width="200" height="118" rx="14" fill="#0b4f47" opacity=".35"
          stroke="#5eead4" stroke-width="3.5" stroke-dasharray="13 10"/>
    <rect x="892" y="368" width="96" height="11" rx="5.5" fill="#5eead4" opacity=".55"/>
    <rect x="892" y="392" width="140" height="9" rx="4.5" fill="#5eead4" opacity=".3"/>
  </g>

  <!-- i due angoli della matrice, per chiudere il riferimento -->
  <path d="M364 176 h-20 M364 176 v-20" stroke="#7fded0" stroke-width="3" opacity=".55" fill="none" stroke-linecap="round"/>
  <path d="M1092 458 h20 M1092 458 v20" stroke="#7fded0" stroke-width="3" opacity=".55" fill="none" stroke-linecap="round"/>

  <!-- la curva del CPL: parte alta e scende -->
  <g opacity=".95">
    <path d="M150 592 C 320 596, 470 610, 600 660 S 800 742, 900 770"
          fill="none" stroke="#eafff9" stroke-width="6" stroke-linecap="round" opacity=".35"/>
    <path d="M150 592 C 320 596, 470 610, 600 660 S 800 742, 900 770"
          fill="none" stroke="#eafff9" stroke-width="9" stroke-linecap="round"/>
    <path d="M150 592 C 320 596, 470 610, 600 660 S 800 742, 900 770 L 900 792 L 150 792 Z"
          fill="#eafff9" opacity=".1"/>
    <path d="M884 748 v46 h34" stroke="#eafff9" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- il segnale di discesa, in alto a destra (tenuto dentro i bordi) -->
  <g stroke="#eafff9" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M1104 140 l-32 38 h21 l-25 40"/>
  </g>
</svg>
