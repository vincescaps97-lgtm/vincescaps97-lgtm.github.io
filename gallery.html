<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Vincenzo Capasso</title>
<!-- nascosta: non è nel menu né nella dock (vedi `hidden` in js/nav.js).
     Il noindex serve finché la pagina esiste ma nessuno deve trovarla
     da un motore di ricerca. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Una parete di immagini: trascina per ruotarla, clicca una cornice per la didascalia.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem("theme");if(!t){t="dark";}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="dark";}})();</script>
<link rel="stylesheet" href="/css/style.css?v=51">
<link rel="stylesheet" href="/css/content.css?v=51">
</head>
<body>

<header class="pagehead">
  <h1 class="pagehead__title">Gallery</h1>
  <p class="pagehead__lede">
    Trascina la parete per ruotarla, clicca una cornice per leggerne la
    didascalia.
  </p>
</header>

<main class="page gallery">
  <canvas id="wall" aria-label="Parete di fotografie trascinabile. Le didascalie sono elencate qui sotto."></canvas>
  <p class="gallery__hint">trascina per ruotare · clicca una cornice</p>

  <section class="sec">
    <div class="sec__head"><h2 class="sec__title">Tutte le cornici</h2></div>
    <ul class="posts" id="captions"></ul>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer class="foot">
  <p>&copy; <span data-year></span> Vincenzo Capasso. Tutti i diritti riservati.</p>
  <p id="footlinks"></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script type="module">
  import { boot } from "/js/site.js";
  import { PROJECTS, GALLERY_CAPTIONS, SOCIALS } from "/js/data.js";
  import { socialLinks } from "/js/render.js";

  boot({ page: "gallery" });

  const art = PROJECTS.map((p) => p.art);
  const toast = document.getElementById("toast");
  let timer;

  const flash = (text) => {
    toast.textContent = text;
    toast.classList.add("is-on");
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove("is-on"), 1600);
  };

  // this is the only page that loads three.js
  const { polaroidWall } = await import("/js/three.js");
  const wall = polaroidWall(document.getElementById("wall"), {
    count: 15,
    art,
    captions: GALLERY_CAPTIONS,
  });

  if (wall) {
    wall.onPick((d) => flash(d.caption));
  } else {
    document.querySelector(".gallery__hint").textContent =
      "WebGL non disponibile — le didascalie sono elencate qui sotto.";
  }

  // caption list, also the no-WebGL fallback
  document.getElementById("captions").innerHTML = GALLERY_CAPTIONS.map((c, i) => {
    const [a, b] = art[i % art.length];
    return `
      <li class="post">
        <div>
          <time>Cornice ${String(i + 1).padStart(2, "0")}</time>
          <h3>${c}</h3>
        </div>
        <span class="post__thumb" style="background-image:linear-gradient(145deg,${a},${b})"></span>
      </li>`;
  }).join("");

  document.getElementById("footlinks").innerHTML = socialLinks(SOCIALS);
</script>
</body>
</html>
